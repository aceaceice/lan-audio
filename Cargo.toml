[package]
name = "lan-audio"
version = "0.1.0"
edition = "2021"
description = "Ultra-low-latency LAN audio streaming between macOS and Linux devices with automatic discovery"
license = "MIT"

[dependencies]
cpal = "0.15"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
